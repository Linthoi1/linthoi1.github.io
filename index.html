<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My CV</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
    }

    header {
      background: #333;
      color: #fff;
      padding: 20px;
      text-align: center;
    }

    .container {
      width: 80%;
      margin: auto;
      overflow: hidden;
    }

    .section {
      background: #fff;
      margin: 20px 0;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    h2 {
      border-bottom: 2px solid #333;
      padding-bottom: 5px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    ul li {
      padding: 5px 0;
    }

    .btn {
      display: inline-block;
      padding: 10px 15px;
      background: #333;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      margin-top: 10px;
    }

    .btn:hover {
      background: #555;
    }
  </style>
</head>
<body>

<header>
  <h1 id="name">Your Name</h1>
  <p id="title">Your Profession</p>
</header>

<div class="container">

  <div class="section">
    <h2>About Me</h2>
    <p id="about">Write a short introduction about yourself.</p>
  </div>

  <div class="section">
    <h2>Skills</h2>
    <ul id="skills">
      <li>Python</li>
      <li>Machine Learning</li>
      <li>Data Analysis</li>
    </ul>
  </div>

  <div class="section">
    <h2>Education</h2>
    <ul>
      <li>PhD / Degree - University Name</li>
    </ul>
  </div>

  <div class="section">
    <h2>Projects</h2>
    <ul>
      <li>Project 1 - Description</li>
      <li>Project 2 - Description</li>
    </ul>
  </div>

  <div class="section">
    <h2>Contact</h2>
    <p>Email: your@email.com</p>
    <button class="btn" onclick="showMessage()">Contact Me</button>
  </div>

</div>

<script>
  function showMessage() {
    alert("Thank you for visiting my CV!");
  }
</script>

</body>
</html>
